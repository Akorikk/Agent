services:
  - type: web
    name: voice-ai-backend
    env: python
    runtime: python-3.11
    plan: free
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: CALENDAR_TIMEZONE
        value: Asia/Kolkata
